[package]
name = "sqlite-vector-rs"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "SQLite extension providing PGVector-like native vector types with HNSW indexing"
repository = "https://github.com/quinnjr/sqlite-vector-rs"
keywords = ["sqlite", "vector", "hnsw", "embedding", "database"]
categories = ["database"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["loadable_extension"]
loadable_extension = []
library = ["dep:rusqlite", "loadable_extension"]

[dependencies]
sqlite3_ext = { package = "sqlite3-ext-vtab", version = "0.2" }
usearch = "2"
arrow-array = "58"
arrow-buffer = "58"
arrow-ipc = "58"
arrow-schema = "58"
half = { version = "2", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled", "vtab", "load_extension"], optional = true }

[[bin]]
name = "sqlite3"
required-features = ["library"]

[dev-dependencies]
rusqlite = { version = "0.39", features = ["bundled", "vtab", "load_extension"] }
rand = "0.9"
tempfile = "3"
pdf-extract = "0.7"
llama-gguf = { version = "0.13", default-features = false }
